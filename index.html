<!DOCTYPE html>
<html>
<head>
    <title>ABC College</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>ABC College</h1>
        <p>Education for a Better Future</p>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Courses</a>
        <a href="#">Contact</a>
    </nav>

    <section class="banner">
        <h2>Welcome to ABC College</h2>
        <p>Learn, Grow and Achieve Your Dreams</p>
    </section>

    <section class="courses">
        <h2>Available Courses</h2>

        <table>
            <tr>
                <th>Course</th>
                <th>Duration</th>
                <th>Fees</th>
            </tr>
            <tr>
                <td>CSE</td>
                <td>4 Years</td>
                <td>100000</td>
            </tr>
            <tr>
                <td>ECE</td>
                <td>4 Years</td>
                <td>90000</td>
            </tr>
            <tr>
                <td>EEE</td>
                <td>4 Years</td>
                <td>85000</td>
            </tr>
        </table>
    </section>

    <section class="contact">
        <h2>Contact Us</h2>

        <form>
            <label>Name:</label>
            <input type="text" placeholder="Enter your name">

            <label>Email:</label>
            <input type="email" placeholder="Enter your email">

            <label>Message:</label>
            <textarea placeholder="Enter message"></textarea>

            <button type="submit">Submit</button>
        </form>
    </section>

    <footer>
        <p>Copyright 2026 ABC College</p>
    </footer>

</body>
</html>
